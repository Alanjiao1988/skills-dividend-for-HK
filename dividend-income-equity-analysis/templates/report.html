<!DOCTYPE html>
<html lang="zh-CN" data-report-mode="{{REPORT_MODE}}" data-ruleset="3.0" data-presentation="html-1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{REPORT_TITLE}}</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 1rem; }
    body {
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font: 1rem/1.75 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-wrap: anywhere;
    }
    a { color: var(--cp-link); text-underline-offset: 0.2em; }
    a:hover { color: var(--cp-accent-hover); }
    a:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 4px; }
    code, pre { font-family: Consolas, "Courier New", Courier, monospace; }
    code { background: var(--cp-surface-soft); padding: 0.125rem 0.25rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .report-header, .report-layout, .report-footer {
      width: min(100% - 3rem, 88rem);
      margin-inline: auto;
    }
    .report-header { padding-block: 3rem 1.5rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.3; }
    h2 { margin: 0 0 1rem; line-height: 1.4; font-size: 1.5rem; }
    h3 { font-size: 1.125rem; margin: 1.5rem 0 0.75rem; }
    p, ul, ol, dl, figure { margin-block: 0.75rem; }
    .report-metadata { color: var(--cp-text-muted); }
    .report-metadata dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; }
    .report-metadata dd { margin: 0; }
    .report-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1.5rem; align-items: start; }
    .report-toc {
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      padding: 1rem;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
    }
    .report-toc h2 { font-size: 1rem; }
    .report-toc ol { padding-left: 1.5rem; }
    .report-toc li { margin-block: 0.5rem; }
    main { min-width: 0; }
    main > section {
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
    }
    .takeaway {
      padding: 0.75rem 1rem;
      border-left: 4px solid var(--cp-accent);
      background: var(--cp-accent-soft);
    }
    .limitations { padding: 1rem; border: 1px solid var(--cp-warning); border-radius: 0.625rem; }
    .muted, figcaption { color: var(--cp-text-muted); }
    .table-scroll { width: 100%; overflow-x: auto; margin-block: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
    caption { text-align: left; color: var(--cp-text-muted); padding-bottom: 0.5rem; }
    th, td { padding: 0.75rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cp-border); }
    th { background: var(--cp-surface-soft); font-weight: 600; }
    .numeric { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    figure { margin-inline: 0; }
    img, svg { display: block; max-width: 100%; height: auto; }
    .report-footer { padding-block: 0.5rem 2rem; color: var(--cp-text-muted); }
    @media (max-width: 56rem) {
      .report-layout { grid-template-columns: minmax(0, 1fr); }
      .report-toc { position: static; max-height: none; }
    }
    @media (max-width: 36rem) {
      .report-header, .report-layout, .report-footer { width: calc(100% - 1.5rem); }
      .report-header { padding-top: 1.5rem; }
      main > section { padding: 1rem; }
      .report-metadata dl { grid-template-columns: 1fr; gap: 0; }
      .report-metadata dd { margin-bottom: 0.5rem; }
    }
    @media print {
      @page { size: auto; margin: 15mm; }
      html, html[data-theme="dark"] {
        color-scheme: light;
        --cp-bg: #ffffff;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-border: #dedede;
        --cp-accent: #b11f4b;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-link: #0078d4;
        --cp-warning: #919191;
      }
      body { font-size: 10pt; }
      .report-header, .report-layout, .report-footer { width: 100%; }
      .report-header { padding-top: 0; }
      .report-layout { display: block; }
      .report-toc { position: static; max-height: none; overflow: visible; margin-bottom: 1rem; }
      main > section { padding: 1rem 0; border: 0; border-radius: 0; }
      h2, h3, caption { break-after: avoid; }
      tr, figure, .takeaway { break-inside: avoid; }
      thead { display: table-header-group; }
      .table-scroll { overflow: visible; }
      table { table-layout: fixed; font-size: 9pt; }
      th, td { overflow-wrap: anywhere; padding: 0.375rem; }
      .numeric { white-space: normal; }
    }
  </style>
</head>
<body>
  <header class="report-header">
    <h1>{{REPORT_TITLE}}</h1>
    <div class="report-metadata">{{REPORT_METADATA}}</div>
  </header>
  <div class="report-layout">
    <nav class="report-toc" aria-label="报告目录">
      <h2>目录</h2>
      {{REPORT_NAV}}
    </nav>
    <main id="report-content">
      {{REPORT_BODY}}
    </main>
  </div>
  <footer class="report-footer">
    <p>本报告为研究资料，不构成个性化投资、税务或法律建议。结论受数据截止日、已列假设与证据限制约束。</p>
  </footer>
</body>
</html>
